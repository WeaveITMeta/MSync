name: Discord Role Sync

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

jobs:
  sync-roles:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Calculate Merit Points
      id: merit
      run: |
        # This would typically call your API to calculate merit points
        # based on the PR content, CodeRabbit score, etc.
        echo "Merit calculation placeholder"
        
    - name: Trigger Discord Role Update
      env:
        WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: |
        curl -X POST $WEBHOOK_URL \
          -H "Content-Type: application/json" \
          -d '{
            "event": "pr_merged",
            "pr_number": "'$PR_NUMBER'",
            "author": "'$PR_AUTHOR'",
            "title": "'$PR_TITLE'"
          }'
          
    - name: Comment on PR
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '🎉 Congratulations @${{ github.event.pull_request.user.login }}! Your contribution has been merged and merit points have been awarded. Check your Discord roles!'
          })

  coderabbit-integration:
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
    - name: Request CodeRabbit Review
      env:
        CODERABBIT_API_KEY: ${{ secrets.CODERABBIT_API_KEY }}
      run: |
        echo "Requesting CodeRabbit review for PR #${{ github.event.pull_request.number }}"
        # Actual CodeRabbit API call would go here
