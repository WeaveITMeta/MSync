  "/api/v1/payorders":
    get:
      tags: [payroll]
      summary: List pay orders
      description: Standing pay orders, optionally by status. Needs scope `payorders.read`.
      x-msync-scope: payorders.read
      security:
        - bearerToken: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by order status (for example `draft`, `pending_approval`, `active`, `paused`, `cancelled`, `completed`).
          schema:
            type: string
      responses:
        "200":
          description: "`{status, payorders: [...]}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [payroll]
      summary: Create a pay order
      description: |
        Creates a pay order: an amount rule plus a schedule. A non-draft order waits for
        approval before it materializes ledger rows. `draft: true` creates it as a draft that
        never materializes until resumed. Needs scope `payorders.manage`. The currency, when
        given, must equal the payout policy currency. Unknown fields are 400.
      x-msync-scope: payorders.manage
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewOrder"
      responses:
        "201":
          description: "`{status, payorder}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  "/api/v1/payorders/{id}":
    get:
      tags: [payroll]
      summary: Get a pay order
      description: One pay order with its approval state and next occurrence. Needs scope `payorders.read`.
      x-msync-scope: payorders.read
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: "`{status, payorder}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [payroll]
      summary: Edit a pay order
      description: |
        Changes the name, memo, currency, rule or schedule. Needs scope `payorders.manage`.
        A change to the rule or schedule bumps the revision and voids earlier approvals, so
        the order must be approved again. 409 when the order is cancelled or completed.
      x-msync-scope: payorders.manage
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
