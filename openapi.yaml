      tags: [payroll]
      summary: Approve an invoice
      description: |
        Approves a submitted invoice and schedules it for payment. Needs scope
        `invoices.approve`. Body must be empty or `{}`. The payee of an invoice can never
        approve it (403); 409 unless the invoice is submitted.
      x-msync-scope: invoices.approve
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
