        `invoices.approve`. 409 when the invoice is already paid or void. An empty body is accepted.
      x-msync-scope: invoices.approve
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonBody"
      responses:
