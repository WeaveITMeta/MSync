openapi: 3.1.0
info:
  title: MSync API
  version: 0.1.0
  description: |
    MSync (MeritSync) scores contributions against a rubric, keeps the member hierarchy
    (the Central Rank Authority, CRA), and runs payouts and payroll. It also signs members in
    and acts as an OAuth 2.0 / OpenID Connect provider for the platforms an organization owns.
    The Foundry API (GitHub and GitLab) feeds it through webhooks.

    Conventions. JSON bodies and responses unless an operation says otherwise. Success bodies
    carry `"status": "success"` (the audit routes use `"ok"`); errors are
    `{"status": "error", "message": "..."}`. Every authentication failure on a bearer route is the
    same 401 `{"status":"error","message":"unauthorized"}`. A missing scope is 403
    `missing scope <name>`. The actor of every write is the token's member; request bodies that
    name an actor or approver are refused with 400 (`additionalProperties: false`).

    This file is checked against the routes the service registers by a test
    (`src/openapi_tests.rs`): every registered method and path must appear here, and every
    operation here must be registered.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: health
    description: Liveness.
  - name: tokens
    description: API token issue and revoke.
  - name: hierarchy
    description: The CRA hierarchy, member standing and snapshots.
  - name: merit
    description: Rubric scoring, merit and the leaderboard.
  - name: payouts
    description: Payout policy, ledger, runs and blocks.
  - name: payroll
    description: Payees, pay orders, invoices and the payee statement.
  - name: audit
    description: The hash-chained audit log.
  - name: portal
    description: Signed server-to-server member lookups for CRA consumers.
  - name: webhooks
    description: Inbound webhooks from the Foundry API (GitHub, GitLab) and Stripe.
  - name: slack
    description: Slack slash commands.
  - name: mcp
    description: Model Context Protocol server.
  - name: accounts
    description: Root accounts, sign-in and sessions.
  - name: oauth
    description: MSync as an OAuth 2.0 / OpenID Connect provider, and client administration.
  - name: legacy
    description: Older routes kept for compatibility.
paths:
  "/health":
    get:
      tags: [health]
      summary: Liveness check
      description: Returns service status, version, uptime and whether dev mode is on. No authentication.
      security: []
      responses:
        "200":
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  "/api/v1/tokens":
    post:
      tags: [tokens]
      summary: Create an API token
      description: |
        Creates an `msync_<id>_<secret>` token bound to a member with a set of scopes. The token
        is shown once, in the 201 response. Needs scope `tokens.manage`, or the bootstrap
        `MSYNC_ADMIN_TOKEN`. A token cannot be granted more than its creator may grant
        (403), and the member must exist (400).
      x-msync-scope: tokens.manage
      security:
        - bearerToken: []
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenBody"
      responses:
        "201":
          description: Token created. `token` carries the secret once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/api/v1/tokens/{id}/revoke":
    post:
      tags: [tokens]
      summary: Revoke an API token
      description: |
        Revokes a token by id. Needs scope `tokens.manage`, or the bootstrap `MSYNC_ADMIN_TOKEN`.
        Revoking a token the caller may not manage is 403.
      x-msync-scope: tokens.manage
      security:
        - bearerToken: []
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Revoked. Body `{"status":"success","revoked":"<id>"}`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/api/v1/hierarchy":
    get:
      tags: [hierarchy]
      summary: The active hierarchy
      description: |
        Roles, titles and ranks of the active CRA snapshot, highest rank first, plus the org mode.
        Needs scope `hierarchy.read`. 404 when no snapshot is active.
      x-msync-scope: hierarchy.read
      security:
        - bearerToken: []
      responses:
        "200":
          description: "`{status, hierarchy: {org_slug, org_name, mode, snapshot_id, commit_sha, loaded_at, roles[]}}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/api/v1/hierarchy/members/{member_id}":
    get:
      tags: [hierarchy]
      summary: A member's standing
      description: |
        Tier, positions, vested merit and effective rank of one member in the active snapshot.
        Needs scope `hierarchy.read`. 404 when no snapshot is active or the member is not listed.
      x-msync-scope: hierarchy.read
      security:
        - bearerToken: []
      parameters:
        - name: member_id
          in: path
          required: true
          description: The CRA member id.
          schema:
            type: string
      responses:
        "200":
          description: "`{status, member: {member_id, name, snapshot_id, vested_merit, owner, effective_rank, standing}}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/api/v1/cra/snapshots":
    get:
      tags: [hierarchy]
      summary: Recent CRA load attempts
      description: |
        Newest first, with status, retryable flag, commit, author, approvers and any violations.
        Needs scope `hierarchy.read`.
      x-msync-scope: hierarchy.read
      security:
        - bearerToken: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Number of rows (default 20).
          schema:
            type: integer
      responses:
        "200":
          description: "`{status, snapshots: [...]}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/api/v1/cra/reload":
    post:
      tags: [hierarchy]
      summary: Reload the CRA from the repository head
      description: |
        Fetches and re-validates the CRA repository head. Needs scope `hierarchy.read` AND a
        member of rank 1000 (an owner); a lower rank is 403. 409 when no CRA repository is
        configured; 502 when the source cannot be read.
      x-msync-scope: hierarchy.read
      security:
        - bearerToken: []
      responses:
        "200":
          description: "`{status, result}` describing the load outcome."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          description: The CRA source (the Foundry API) could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v1/merit/rubric":
    get:
      tags: [merit]
      summary: The scoring rubric
      description: The rubric id, hash, criteria and levels a score must cite. No authentication.
      security: []
      responses:
        "200":
          description: "`{status, rubric}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
  "/api/v1/merit/scores":
    post:
      tags: [merit]
      summary: Submit a rubric score
      description: |
        Records a score for one subject (a pull request, merge request or similar) as the token's
        member; there is no scorer field. All six criteria are required, each with a level and
        evidence. Needs scope `merit.score`. 400 for a stale rubric id or hash or a bad level,
        403 when the scorer may not score this subject (for example their own work), 409 for a
        duplicate submission.
      x-msync-scope: merit.score
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreInput"
      responses:
        "201":
          description: "`{status, score, aggregate: {score, counted_scorers, min_scorers}, merit_adjustment}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [merit]
      summary: List scores for a subject
      description: |
        Every submitted score for one subject, with the aggregate (median of counted scorers, null
        below the minimum). Needs scope `merit.read`. Unknown query parameters are 400.
      x-msync-scope: merit.read
      security:
        - bearerToken: []
      parameters:
        - name: provider
          in: query
          required: true
          description: Foundry provider, `github` or `gitlab`.
          schema:
            type: string
            enum: [github, gitlab]
        - name: host
          in: query
          required: false
          description: Provider host; defaults to github.com or gitlab.com.
          schema:
            type: string
        - name: repo
          in: query
          required: true
          description: Repository path, for example `owner/name`.
          schema:
            type: string
        - name: subject_id
          in: query
          required: true
          description: Pull request or merge request number, or other subject id.
          schema:
            type: string
      responses:
        "200":
          description: "`{status, subject, scores[], aggregate}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/api/v1/leaderboard":
    get:
      tags: [merit]
      summary: Merit leaderboard (authenticated)
      description: |
        Ranked contributors with per-repository points. Private repositories are named for
        callers with `merit.read`. Needs scope `merit.read`. Unknown query parameters are 400.
      x-msync-scope: merit.read
      security:
        - bearerToken: []
      parameters:
        - name: provider
          in: query
          required: false
          description: With `repo`, rank by XP earned in that repository alone.
          schema:
            type: string
            enum: [github, gitlab]
        - name: host
          in: query
          required: false
          description: Provider host.
          schema:
            type: string
        - name: repo
          in: query
          required: false
          description: Repository path.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum rows.
          schema:
            type: integer
      responses:
        "200":
          description: "`{status, leaderboard: [{rank, contributor_id, github_username, current_role, contributions_count, total_points, by_repo}]}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/api/v1/members/{contributor_id}/merit":
    get:
      tags: [merit]
      summary: One contributor's merit
      description: |
        Total points with a breakdown by repository and by contribution kind. Needs scope
        `merit.read`. 404 for an unknown contributor.
      x-msync-scope: merit.read
      security:
        - bearerToken: []
      parameters:
        - name: contributor_id
          in: path
          required: true
          description: The contributor id.
          schema:
            type: string
      responses:
        "200":
          description: "`{status, merit: {contributor_id, github_username, total_points, by_repo, by_kind}}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/api/v1/payouts/policy":
    get:
      tags: [payouts]
      summary: The effective payout policy
      description: |
        The stored policy, or the default built from configuration when none is stored
        (`source` is `stored` or `default`). Needs scope `payouts.read`.
      x-msync-scope: payouts.read
      security:
        - bearerToken: []
      responses:
        "200":
          description: "`{status, source, version, updated_by, updated_at, policy}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags: [payouts]
      summary: Store the payout policy
      description: |
        Replaces the stored policy. Needs scope `payouts.policy`. While a CRA snapshot is active
        the policy is authored in the CRA repository and this call is refused with 409; with no
        snapshot active it is handled normally. `expected_version` is optimistic concurrency:
        the write is refused with 409 unless the stored version equals it (0 means none stored
        yet). An invalid policy is 400 with every violation in the message.
      x-msync-scope: payouts.policy
      security:
        - bearerToken: []
      parameters:
        - name: expected_version
          in: query
          required: false
          description: Refuse unless the current version equals this (0 = none stored yet).
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutPolicy"
      responses:
        "200":
          description: "`{status, version, policy}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Version conflict, or the policy is authored in the CRA while a snapshot is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v1/payouts/ledger":
    get:
      tags: [payouts]
      summary: List ledger entries
      description: Ledger rows, optionally filtered by status. Needs scope `payouts.read`.
      x-msync-scope: payouts.read
      security:
        - bearerToken: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by ledger status (for example `pending`, `approved`, `paid`, `rejected`).
          schema:
            type: string
      responses:
        "200":
          description: "`{status, entries: [...]}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/api/v1/payouts/ledger/{id}/approve":
    post:
      tags: [payouts]
      summary: Approve one ledger row
      description: |
        Records the token's member as an approver of the row. Needs scope `payouts.approve`.
        The request body is ignored. A payee can never approve their own payout (403), the
        approver must meet the policy's minimum rank, and the same member cannot approve twice.
        409 when the row is not in an approvable state or the payout policy is disabled.
      x-msync-scope: payouts.approve
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: "`{status, result, approver_member_id}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  "/api/v1/payouts/runs":
    post:
      tags: [payouts]
      summary: Prepare a payout run
      description: |
        Builds a run from the payable ledger rows under the current policy. `dry_run` defaults
        to true: only an explicit `false` persists a run. Needs scope `payouts.prepare`.
        409 when the payout policy is disabled (kill switch).
      x-msync-scope: payouts.prepare
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunBody"
      responses:
        "200":
          description: "Dry run. `{status, dry_run: true, plan}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "201":
          description: "Run created. `{status, dry_run: false, run, plan}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/v1/payouts/runs/{id}":
    get:
      tags: [payouts]
      summary: Get a payout run
      description: One run with its items and their approval state. Needs scope `payouts.read`.
      x-msync-scope: payouts.read
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: "`{status, run}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/api/v1/payouts/runs/{id}/approve":
    post:
      tags: [payouts]
      summary: Approve every item of a run
      description: |
        Approves each item as the token's member and reports per-item results. Needs scope
        `payouts.approve`. The request body is ignored. Items the caller is the payee of are
        refused individually (the self-approval rule); a run that is not open is 409.
      x-msync-scope: payouts.approve
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: "`{status, report}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  "/api/v1/payouts/runs/{id}/execute":
    post:
      tags: [payouts]
      summary: Execute a payout run
      description: |
        Pays every approved, still-payable item through Stripe Connect transfers. Needs scope
        `payouts.execute`. Every payable check is re-run at execution time. 409 when the run
        is not executable; 503 when payouts are not configured.
      x-msync-scope: payouts.execute
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: "`{status, report}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/v1/payouts/runs/{id}/cancel":
    post:
      tags: [payouts]
      summary: Cancel a payout run
      description: Cancels a run that has not been executed. Needs scope `payouts.prepare`. 409 once executed.
      x-msync-scope: payouts.prepare
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: "`{status, run}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  "/api/v1/payouts/blocks":
    post:
      tags: [payouts]
      summary: Block a payee key from payouts
      description: |
        Adds a block on a payee key (a GitHub login, `gitlab:<login>`, or `payee:<id>`) with a
        reason. Blocked keys are never paid. Needs scope `payouts.approve`.
      x-msync-scope: payouts.approve
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockBody"
      responses:
        "200":
          description: Blocked. `{status}`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/api/v1/payouts/blocks/{payee_key}":
    delete:
      tags: [payouts]
      summary: Remove a payee block
      description: Removes the block on a payee key. Needs scope `payouts.approve`. `removed` says whether a block existed.
      x-msync-scope: payouts.approve
      security:
        - bearerToken: []
      parameters:
        - name: payee_key
          in: path
          required: true
          description: The blocked payee key.
          schema:
            type: string
      responses:
        "200":
          description: "`{status, removed}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/api/v1/payouts/statement":
    get:
      tags: [payouts]
      summary: A payee's statement
      description: |
        Paid and pending amounts for one payee over a date range. Needs scope `payouts.read`;
        a caller who is the payee may read their own statement. `from` and `to` are dates
        (`YYYY-MM-DD`); a bad value is 400.
      x-msync-scope: payouts.read
      security:
        - bearerToken: []
      parameters:
        - name: payee
          in: query
          required: true
          description: Payee id.
          schema:
            type: string
        - name: from
          in: query
          required: true
          description: Start date, inclusive (`YYYY-MM-DD`).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: End date (`YYYY-MM-DD`).
          schema:
            type: string
            format: date
      responses:
        "200":
          description: "`{status, statement}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/api/v1/payees":
    get:
      tags: [payroll]
      summary: List payees
      description: Payees of the organization, optionally by status. Needs scope `payees.read`.
      x-msync-scope: payees.read
      security:
        - bearerToken: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by payee status.
          schema:
            type: string
            enum: [active, paused, closed]
      responses:
        "200":
          description: "`{status, payees: [...]}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [payroll]
      summary: Create a payee
      description: |
        Registers a payee. There is no bank or card field by design: money moves through the
        payee's Stripe Connect account. Needs scope `payees.manage`. Unknown fields are 400.
      x-msync-scope: payees.manage
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPayee"
      responses:
        "201":
          description: "`{status, payee}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  "/api/v1/payees/{id}":
