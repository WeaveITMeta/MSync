          $ref: "#/components/responses/Conflict"
  "/api/v1/audit":
    get:
      tags: [audit]
      summary: Read the audit log
      description: |
        One page of the hash-chained audit log, oldest first. Page with `after` set to the
        previous `next_after`. Needs scope `audit.read`. Unknown query parameters are 400.
      x-msync-scope: audit.read
      security:
        - bearerToken: []
      parameters:
        - name: actor
          in: query
          required: false
          description: Only entries by this actor.
          schema:
            type: string
        - name: action
          in: query
          required: false
          description: Only this action (for example `payorder.approve`).
          schema:
            type: string
        - name: target
          in: query
          required: false
          description: Only this target.
          schema:
            type: string
        - name: after
          in: query
          required: false
          description: Only entries with `seq` greater than this (the paging cursor).
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          description: Page size, 1 to 500 (default 100).
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: "`{status: \"ok\", entries: [...], next_after}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/api/v1/audit/verify":
    get:
      tags: [audit]
      summary: Verify the audit chain
      description: Walks the hash chain and names the first broken entry, if any. Needs scope `audit.read`.
      x-msync-scope: audit.read
      security:
        - bearerToken: []
      responses:
        "200":
          description: "`{status: \"ok\", verify: {...}}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/api/v1/members/by-discord/{discord_id}":
    get:
      tags: [portal]
      summary: Portal lookup by Discord id
      description: |
        Signed server-to-server read of one member's standing for a CRA consumer. Not a bearer
        route: sign with `portalHmac`. Every authentication failure is the same 401
        `{"error":"unauthorized"}`; an unknown member, a member the consumer may not see, and
        every lookup while no snapshot is active are the same 404 `{"error":"not_found"}`.
        A suspended or removed member is 200 with that status and no permissions. Fields outside
        the consumer's allowlist are omitted, never null. 503 when `MSYNC_SUBJECT_KEY` is not
        configured or the lookup could not be recorded.
      security:
        - portalHmac: []
      parameters:
        - name: discord_id
          in: path
          required: true
          description: The Discord user id.
          schema:
            type: string
        - $ref: "#/components/parameters/PortalScopes"
      responses:
        "200":
          description: The member as the consumer may see it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalMember"
        "401":
          $ref: "#/components/responses/PortalUnauthorized"
        "404":
          $ref: "#/components/responses/PortalNotFound"
        "503":
          $ref: "#/components/responses/PortalUnavailable"
  "/api/v1/members/by-slack/{team_id}/{user_id}":
    get:
      tags: [portal]
      summary: Portal lookup by Slack identity
      description: |
        Same contract as the Discord lookup. A Slack team the CRA does not name is the same 404
        as an unknown member. Sign with `portalHmac`.
      security:
        - portalHmac: []
      parameters:
        - name: team_id
          in: path
          required: true
          description: The Slack workspace (team) id.
          schema:
            type: string
        - name: user_id
          in: path
          required: true
          description: The Slack user id.
          schema:
            type: string
        - $ref: "#/components/parameters/PortalScopes"
      responses:
        "200":
          description: The member as the consumer may see it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalMember"
        "401":
          $ref: "#/components/responses/PortalUnauthorized"
        "404":
          $ref: "#/components/responses/PortalNotFound"
        "503":
          $ref: "#/components/responses/PortalUnavailable"
  "/api/v1/members/{subject}":
    get:
      tags: [portal]
      summary: Portal lookup by pairwise subject id
      description: |
        Same contract as the Discord lookup, keyed by the consumer's own `sub_...` subject id
        (returned by an earlier lookup). A subject id issued to another consumer is a 404.
        Sign with `portalHmac`.
      security:
        - portalHmac: []
      parameters:
        - name: subject
          in: path
          required: true
          description: A pairwise subject id (`sub_` plus 32 hex characters).
          schema:
            type: string
        - $ref: "#/components/parameters/PortalScopes"
      responses:
        "200":
          description: The member as the consumer may see it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalMember"
        "401":
          $ref: "#/components/responses/PortalUnauthorized"
        "404":
          $ref: "#/components/responses/PortalNotFound"
        "503":
          $ref: "#/components/responses/PortalUnavailable"
  "/github/webhook":
    post:
      tags: [webhooks]
      summary: GitHub webhook (Foundry API)
      description: |
        Receives GitHub events (merged pull requests, pushes to the CRA repository, reviews).
        The `X-Hub-Signature-256` header (`sha256=<hex>`, HMAC-SHA256 of the raw body with the
        webhook secret) is verified before anything is parsed; a bad or missing signature is 401.
        An unparsable payload is 400. A push to the CRA repository may load a new CRA snapshot.
      security:
        - githubSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A GitHub webhook payload.
              additionalProperties: true
      responses:
        "200":
          description: Processed (or deliberately ignored). Body `{status, message, ...}`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  "/gitlab/webhook":
    post:
      tags: [webhooks]
      summary: GitLab webhook (Foundry API)
      description: |
        Receives GitLab events (merged merge requests, pushes to the CRA repository). The
        `X-Gitlab-Token` header must equal the configured secret; a bad or missing token is 401.
        An unparsable payload is 400.
      security:
        - gitlabToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A GitLab webhook payload.
              additionalProperties: true
      responses:
        "200":
          description: Processed (or deliberately ignored). Body `{status, message, ...}`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  "/stripe/webhook":
    post:
      tags: [webhooks]
      summary: Stripe webhook
      description: |
        Verifies `Stripe-Signature` (timestamped HMAC-SHA256 with `STRIPE_WEBHOOK_SECRET`, with a
        replay tolerance) and handles `account.updated` to record whether a connected account can
        receive transfers. Other event types are acknowledged. A bad signature is 401, an
        unparsable payload 400.
      security:
        - stripeSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A Stripe event.
              additionalProperties: true
      responses:
        "200":
          description: "Acknowledged. Body `{\"received\": true}`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  "/slack/commands":
    post:
      tags: [slack]
      summary: Slack slash commands
      description: |
        Receives Slack slash commands as `application/x-www-form-urlencoded`. The v0 signature
        (`X-Slack-Signature` over `v0:<timestamp>:<body>`, with `X-Slack-Request-Timestamp`) is
        verified first; a bad signature or a stale timestamp is 401. Only the configured or
        CRA-listed workspace is served (403 otherwise). Slow commands are acknowledged at once
        and finished through Slack's `response_url`. An unknown command gets a private "Unknown
        command" reply with status 200.
      security:
        - slackSignature: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/SlackCommandForm"
      responses:
        "200":
          description: A Slack message payload (`response_type`, `text`).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: The form could not be parsed.
        "401":
          description: Invalid signature or timestamp outside the replay window.
        "403":
          description: The request is from a workspace this service does not serve.
  "/mcp":
    post:
      tags: [mcp]
      summary: MCP JSON-RPC endpoint
      description: |
        Model Context Protocol server: JSON-RPC 2.0 over HTTP with plain JSON responses; no
        SSE stream and no sessions. Same bearer tokens and scopes as REST; tools the token
        cannot use are not listed. Checks, in order: bearer token (401, same body as REST),
        `MCP-Protocol-Version` header (400 if present and unsupported; supported versions
        2025-06-18, 2025-03-26, 2024-11-05), JSON-RPC framing (400), then the method
        (`initialize`, `ping`, `tools/list`, `tools/call`). A notification gets 202 with no body.
        Tool errors are JSON-RPC errors inside a 200. `payouts_run_execute` is available only
        when `MSYNC_MCP_ALLOW_EXECUTE=true`. See docs/MCP.md.
      x-msync-scope: any scope; each tool names its own
      security:
        - bearerToken: []
      parameters:
        - name: MCP-Protocol-Version
          in: header
          required: false
          description: One of the supported protocol versions.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRpcRequest"
      responses:
        "200":
          description: A JSON-RPC response (`result` or `error`).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "202":
          description: A notification or response object was accepted; no body.
        "400":
          description: Bad protocol version or malformed JSON-RPC (body is a JSON-RPC error).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [mcp]
      summary: MCP stream (not offered)
      description: "The server is stateless and offers no SSE stream. Always 405 with `Allow: POST`. No authentication."
      security: []
      responses:
        "405":
          description: Method not allowed; use POST.
          headers:
            Allow:
              description: Always `POST`.
              schema:
                type: string
  "/auth/{provider}/start":
    get:
      tags: [accounts]
      summary: Start an OAuth sign-in with an identity provider
      description: |
        Starts a PKCE authorization-code sign-in at the named provider (for example `github`,
        `gitlab`, `discord`, `google`; only enabled providers work) and redirects to it (302)
        with a short-lived `msync_signin` cookie. 404 for an unknown or disabled provider.
        `link` adds the identity to the signed-in account instead of signing in; it must be the
        session's link nonce (403 `link_requires_session` otherwise). `next` is a same-site path
        to return to afterwards; anything else is replaced by a safe default.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: Provider key.
          schema:
            type: string
        - name: next
          in: query
          required: false
          description: Same-site path to return to after sign-in.
          schema:
            type: string
        - name: link
          in: query
          required: false
          description: The session's link nonce, to link this identity to the signed-in account.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the provider's authorization page.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: The `msync_signin` browser-binding cookie (path /auth, Secure, HttpOnly, SameSite=Lax).
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  "/auth/{provider}/callback":
    get:
      tags: [accounts]
      summary: Identity provider callback
      description: |
        Completes the sign-in. Needs the `msync_signin` cookie from the start request and a
        matching one-use `state`. On success sets the `msync_session` cookie and redirects (302)
        to the stored `next` path. 400 for a missing code or state, a provider error or a bad
        state; 403 for a suspended account or a link that did not start in this session; 409
        when the identity cannot be linked (it already belongs to another account); 502 when the
        provider did not complete the exchange.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: Provider key.
          schema:
            type: string
        - name: code
          in: query
          required: false
          description: Authorization code from the provider.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: The state issued by the start request.
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Set by the provider when the user declined.
          schema:
            type: string
      responses:
        "302":
          description: Signed in; redirect to the `next` path with a `msync_session` cookie.
          headers:
            Location:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          description: The provider did not complete the sign-in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/auth/logout":
    post:
      tags: [accounts]
      summary: Sign out
      description: |
        Revokes the current session (or every session of the account with `all=true`) and clears
        the cookie. Must be a same-origin request (403 otherwise). 401 `no_session` when not
        signed in.
      security:
        - session: []
      parameters:
        - name: all
          in: query
          required: false
          description: Revoke every session of the account.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: "`{status: \"success\", all}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/account":
    get:
      tags: [accounts]
      summary: The signed-in account
      description: |
        The account, its linked identities, recent account events, the CRA member it resolves
        to, that member's standing, a `link_nonce` for linking more identities, and the enabled
        sign-in providers. Never cached. 401 `no_session` when not signed in.
      security:
        - session: []
      responses:
        "200":
          description: "`{account, identities, events, member_id, standing, link_nonce, providers}`."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/NoSession"
        "500":
          $ref: "#/components/responses/ServerError"
  "/account/identities/{id}/unlink":
    post:
      tags: [accounts]
      summary: Unlink an identity
      description: |
        Removes one linked identity from the signed-in account. Same-origin only (403
        otherwise). 404 `not_yours` for an identity of another account; 409 `last_one` when it
        is the account's last way to sign in.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: "`{status: \"success\", unlinked}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/NoSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  "/auth/email/start":
    post:
      tags: [accounts]
      summary: Send a one-time email sign-in link
      description: |
        Sends a single-use link, valid 15 minutes, to the address. The answer is the same
        whether or not the address can sign in. Same-origin only (403). `link` is the session's
        link nonce, to add the address to the signed-in account. 400 `invalid_email`; 429
        `rate_limited`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailStartBody"
      responses:
        "200":
          description: "`{status: \"success\", message}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: Too many sign-in links requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  "/auth/email/verify":
    get:
      tags: [accounts]
      summary: Email link landing page
      description: |
        HTML page that asks the member to confirm the sign-in (a link prefetcher cannot consume
        the token because only the POST does). 410 for a used or expired link, 404 for an
        unknown one.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: The token from the email link.
          schema:
            type: string
      responses:
        "200":
          description: Confirmation page.
          content:
            text/html:
              schema:
                type: string
        "404":
          description: Unknown link.
          content:
            text/html:
              schema:
                type: string
        "410":
          description: The link was already used or has expired.
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [accounts]
      summary: Consume an email sign-in link
      description: |
        Consumes the one-time token (form field `token`), creates the session cookie and
        redirects (302). Same-origin only (403). An unknown, used or expired token is an HTML
        410 page.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "302":
          description: Signed in; redirect with a `msync_session` cookie.
          headers:
            Location:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: The link is unknown, used or expired (HTML page).
          content:
            text/html:
              schema:
                type: string
  "/.well-known/openid-configuration":
    get:
      tags: [oauth]
      summary: OpenID Connect discovery document
      description: Issuer and endpoint metadata. 503 `temporarily_unavailable` when the provider is not configured (`MSYNC_KEY_ENCRYPTION_KEY` unset). No authentication.
      security: []
      responses:
        "200":
          description: The discovery document (authorization code with PKCE S256, pairwise subjects).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          $ref: "#/components/responses/OAuthUnavailable"
  "/oauth/jwks":
    get:
      tags: [oauth]
      summary: Signing keys (JWKS)
      description: Public keys for verifying ID tokens and access tokens; retired keys stay published for a grace period. Cacheable for 300 seconds. No authentication.
      security: []
      responses:
        "200":
          description: A JWK set.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          $ref: "#/components/responses/OAuthUnavailable"
  "/oauth/authorize":
    get:
      tags: [oauth]
      summary: Authorization endpoint
      description: |
        Authorization-code flow with mandatory PKCE (`code_challenge_method=S256`) and the
        `openid` scope. A request with a bad client or redirect URI is an HTML error page and is
        never redirected; other errors redirect back with `error`, `error_description`, `state`
        and `iss`. Without a session the answer is an HTML sign-in page (401). A member who has
        not consented sees a consent form (200); one who has is redirected (302) with `code`.
        Not an active member of the organization: redirect with `access_denied`.
      security:
        - session: []
      parameters:
        - name: response_type
          in: query
          required: true
          description: Must be `code`.
          schema:
            type: string
            enum: [code]
        - name: client_id
          in: query
          required: true
          description: A registered client id.
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          description: Must match one the client registered.
          schema:
            type: string
        - name: scope
          in: query
          required: true
          description: Space-separated scopes; must include `openid`. Supported are openid, profile, groups, rank, merit.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: Opaque value echoed on the redirect (at most 2048 characters).
          schema:
            type: string
        - name: nonce
          in: query
          required: false
          description: Echoed in the ID token (at most 512 characters).
          schema:
            type: string
        - name: code_challenge
          in: query
          required: true
          description: PKCE challenge, 43 to 128 characters.
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          description: Must be `S256`.
          schema:
            type: string
            enum: [S256]
      responses:
        "200":
          description: HTML consent form.
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Redirect to the client with `code` (or an `error`), and `iss`.
          headers:
            Location:
              schema:
                type: string
        "400":
          description: HTML error page (unknown client or unregistered redirect URI).
          content:
            text/html:
              schema:
                type: string
        "401":
          description: HTML sign-in page; no session.
          content:
            text/html:
              schema:
                type: string
        "503":
          $ref: "#/components/responses/OAuthUnavailable"
    post:
      tags: [oauth]
      summary: Submit the consent form
      description: |
        Receives the consent form (the same parameters as the GET plus `csrf` and `decision`
        of `allow` or `deny`). Same-origin only; the CSRF value is bound to the session (403
        when stale). `allow` records the consent and redirects with `code`; anything else
        redirects with `access_denied`.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/AuthorizeForm"
      responses:
        "302":
          description: Redirect to the client with `code` or an `error`.
          headers:
            Location:
              schema:
                type: string
        "400":
          description: HTML error page.
          content:
            text/html:
              schema:
                type: string
        "401":
          description: HTML sign-in page; no session.
          content:
            text/html:
              schema:
                type: string
        "403":
          description: Cross-origin request or stale consent form.
          content:
            text/html:
              schema:
                type: string
        "503":
          $ref: "#/components/responses/OAuthUnavailable"
  "/oauth/token":
    post:
      tags: [oauth]
      summary: Token endpoint
      description: |
        `grant_type=authorization_code` (with `code`, `redirect_uri`, `code_verifier`) or
        `grant_type=refresh_token` (with `refresh_token`). The client authenticates with HTTP
        Basic, or `client_id` plus `client_secret` in the form, or `client_id` alone for a
        public client; sending two methods is 400. A reused authorization code or refresh token
        revokes the whole token family. Refresh tokens rotate on every use. Errors are
        `{error, error_description}` with 400, or 401 `invalid_client`.
      security:
        - oauthClient: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenForm"
      responses:
        "200":
          description: "`{access_token, token_type: Bearer, expires_in, refresh_token, scope, id_token}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenResponse"
        "400":
          $ref: "#/components/responses/OAuthError"
        "401":
          $ref: "#/components/responses/OAuthError"
        "503":
          $ref: "#/components/responses/OAuthUnavailable"
  "/oauth/revoke":
    post:
      tags: [oauth]
      summary: Revoke a token (RFC 7009)
      description: |
        Revokes the grant behind a refresh token (`msr_...`) or an access token issued to the
        authenticating client. Always 200 for a well-formed request, whether or not the token
        was known. Client authentication as at `/oauth/token`.
      security:
        - oauthClient: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenForm"
      responses:
        "200":
          description: Revoked, or nothing to revoke.
        "400":
          $ref: "#/components/responses/OAuthError"
        "401":
          $ref: "#/components/responses/OAuthError"
        "503":
          $ref: "#/components/responses/OAuthUnavailable"
  "/oauth/userinfo":
    get:
      tags: [oauth]
      summary: UserInfo
      description: |
        Claims for the grant's member, limited to the granted scopes and the client's allowed
        claims. Bearer is an MSync OAuth access token (a JWT with `typ` at+jwt), not an `msync_`
        API token. 401 with `WWW-Authenticate` for a bad, expired or revoked token or a member
        who is no longer active.
      security:
        - oauthAccessToken: []
      responses:
        "200":
          description: Claims (`sub`, plus `name`, `handle`, `groups`, `titles`, `rank`, `merit` as granted).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/BearerInvalid"
        "503":
          $ref: "#/components/responses/OAuthUnavailable"
    post:
      tags: [oauth]
      summary: UserInfo (POST)
      description: The same as the GET, for clients that prefer POST. The bearer token goes in the Authorization header.
      security:
        - oauthAccessToken: []
      responses:
        "200":
          description: Claims, as for GET.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/BearerInvalid"
        "503":
          $ref: "#/components/responses/OAuthUnavailable"
  "/api/v1/oauth/clients":
    post:
      tags: [oauth]
      summary: Register an OAuth client
      description: |
        Registers a platform that signs members in with MSync. The client secret is shown once
        (none for a public client). Needs scope `oauth.clients` held by a member of rank 1000
        (an owner), or the bootstrap `MSYNC_ADMIN_TOKEN`. A browser session never authorizes
        this. 400 for invalid scopes, claims or redirect URIs, or a `consumer_key` the active
        CRA does not list.
      x-msync-scope: oauth.clients
      security:
        - bearerToken: []
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewClient"
      responses:
        "201":
          description: "`{status, client_id, client_secret, client}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/api/v1/oauth/keys/rotate":
    post:
      tags: [oauth]
      summary: Rotate the OAuth signing key
      description: |
        Creates a new signing key; the old one stays published in the JWKS for a grace period so
        issued tokens keep verifying. Needs scope `oauth.clients` held by an owner, or the
        bootstrap `MSYNC_ADMIN_TOKEN`. 503 when `MSYNC_KEY_ENCRYPTION_KEY` is not configured.
      x-msync-scope: oauth.clients
      security:
        - bearerToken: []
        - adminToken: []
      responses:
        "200":
          description: "`{status, kid}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/payouts/return":
    get:
      tags: [payouts]
      summary: Stripe onboarding return page
      description: Stripe sends the contributor here after onboarding. A static HTML page; the account status arrives separately through the Stripe webhook. No authentication.
      security: []
      responses:
        "200":
          description: HTML confirmation page.
          content:
            text/html:
              schema:
                type: string
  "/payouts/refresh":
    get:
      tags: [payouts]
      summary: Stripe onboarding link refresh
      description: |
        Stripe sends the contributor here when an onboarding link expired. With a valid
        signature (`sig`, an HMAC of the account id) for a known connected account, creates a
        new link and redirects to it (302). Otherwise (missing or bad signature, unknown
        account) an HTML "Link expired" page with status 200.
      security: []
      parameters:
        - name: account
          in: query
          required: false
          description: The Stripe connected account id.
          schema:
            type: string
        - name: sig
          in: query
          required: false
          description: Signature MSync put on the refresh URL.
          schema:
            type: string
      responses:
        "200":
          description: HTML page ("Link expired" or "Something went wrong").
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Redirect to a fresh Stripe onboarding link.
          headers:
            Location:
              schema:
                type: string
  "/api/payouts/onboard":
    post:
      tags: [legacy]
      summary: Create a Stripe onboarding link for a contributor
      description: |
        Legacy server-to-server route. Creates or reuses a Stripe Express account for a linked
        contributor and returns an onboarding link. Needs the bootstrap `MSYNC_ADMIN_TOKEN`
        (503 when it is unset, 401 when wrong). 404 for an unknown contributor, 422 when the
        contributor has not linked an account, 502 when Stripe fails.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardRequest"
      responses:
        "200":
          description: "`{status, account_id, onboarding_url}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The contributor has no linked account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Stripe refused or failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/admin/ledger":
    get:
      tags: [legacy]
      summary: List ledger entries (legacy admin)
      description: Legacy admin route. Needs the bootstrap `MSYNC_ADMIN_TOKEN` (503 when unset). Prefer `/api/v1/payouts/ledger`.
      security:
        - adminToken: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by ledger status.
          schema:
            type: string
      responses:
        "200":
          description: "`{status, entries: [...]}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/admin/ledger/{id}/approve":
    post:
      tags: [legacy]
      summary: Approve a ledger entry (legacy admin)
      description: |
        Legacy admin approve. With no stored payout policy it pays immediately and records
        `decided_by` from the body. With a stored policy it counts as one approval by the
        `admin-token` member and pays only when the policy allows a single approver and every
        other payable check passes; otherwise it answers 202 `approval_recorded` with the
        remaining blockers. 404 unknown entry, 409 wrong state, 422 not payable.
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: Approved and transferred. `{status, entry}`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "202":
          description: "Approval recorded; more approvals or checks are needed. `{status: \"approval_recorded\", approver, entry, blockers}`."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: The entry is not payable (for example the payee has no payout account).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/admin/ledger/{id}/reject":
    post:
      tags: [legacy]
      summary: Reject a ledger entry (legacy admin)
      description: Legacy admin reject; records `decided_by` and the reason (default "rejected by admin"). Needs the bootstrap `MSYNC_ADMIN_TOKEN`. 404 unknown entry, 409 wrong state.
      security:
        - adminToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: "`{status, entry}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/contributor/stats":
    get:
      tags: [legacy]
      summary: Contributor statistics (public)
      description: Total merit points, role and contribution count for one contributor by GitHub username. No authentication. 404 when the username is unknown.
      security: []
      parameters:
        - name: github_username
          in: query
          required: true
          description: The contributor's GitHub login.
          schema:
            type: string
      responses:
        "200":
          description: The contributor's statistics.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Unknown contributor.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          $ref: "#/components/responses/ServerError"
  "/api/leaderboard":
    get:
      tags: [legacy]
      summary: Public leaderboard
      description: |
        Top 25 contributors. Public: private repositories are combined, never named. No
        authentication. Prefer `/api/v1/leaderboard`.
      security: []
      responses:
        "200":
          description: "`{leaderboard: [...], generated_at}`."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          $ref: "#/components/responses/ServerError"
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: |
        An MSync API token, `msync_<id>_<secret>`, bound to a member and a set of scopes
        (created with `POST /api/v1/tokens`). OpenAPI 3.1 has no scopes for http bearer, so each
        operation names its required scope in its description and in the `x-msync-scope`
        extension. A token never exceeds its member's rights. Scopes: hierarchy.read, merit.read,
        merit.score, payouts.read, payouts.prepare, payouts.approve, payouts.execute,
        payouts.policy, tokens.manage, payees.read, payees.manage, payorders.read,
        payorders.manage, payorders.approve, invoices.submit, invoices.read, invoices.approve,
        audit.read, oauth.clients.
    adminToken:
      type: http
      scheme: bearer
      description: The bootstrap `MSYNC_ADMIN_TOKEN` as a bearer token. Used to mint the first API token, to register OAuth clients, and on the legacy `/api/admin` and `/api/payouts/onboard` routes. When it is unset those routes answer 503.
    githubSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: "`sha256=<hex>`: HMAC-SHA256 of the raw request body keyed with the GitHub webhook secret."
    gitlabToken:
      type: apiKey
      in: header
      name: X-Gitlab-Token
      description: The shared GitLab webhook secret, compared in constant time.
    slackSignature:
      type: apiKey
      in: header
      name: X-Slack-Signature
      description: "`v0=<hex>`: HMAC-SHA256 of `v0:<timestamp>:<raw body>` keyed with the Slack signing secret. `X-Slack-Request-Timestamp` carries the timestamp and must be within the replay window."
    stripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: "Stripe's `t=<timestamp>,v1=<hex>` header: HMAC-SHA256 of `<timestamp>.<raw body>` keyed with `STRIPE_WEBHOOK_SECRET`, within a replay tolerance."
    portalHmac:
      type: apiKey
      in: header
      name: X-MSync-Signature
      description: |
        Signed server-to-server requests for CRA consumers (docs/PORTAL_API.md). Five headers:
        `X-MSync-Consumer` (the consumer key listed in the CRA), `X-MSync-Key-Id`,
        `X-MSync-Timestamp` (unix seconds, within 300 seconds of the server clock),
        `X-MSync-Nonce` (22 to 128 base64url characters, new for every request) and
        `X-MSync-Signature` (`v1=<hex HMAC-SHA256 of the string to sign>`, keyed with the
        consumer secret of at least 32 bytes). The string to sign is six lines joined by a
        newline with no trailing newline: `v1`; `GET`; the path and query exactly as sent;
        the timestamp value; the nonce value; the lowercase hex SHA-256 of the body (the hash of
        the empty string for GET). The server also enforces a per-consumer rate limit.
    session:
      type: apiKey
      in: cookie
      name: msync_session
      description: The browser session cookie set at sign-in (Secure, HttpOnly). State-changing routes also require a same-origin request.
    oauthClient:
      type: http
      scheme: basic
      description: Client authentication at `/oauth/token` and `/oauth/revoke`. HTTP Basic (`client_secret_basic`), or `client_id` and `client_secret` in the form body (`client_secret_post`), or `client_id` alone for a public client (`none`, PKCE required). Use exactly one method.
    oauthAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An access token (`typ` at+jwt) issued by `/oauth/token`. Not an `msync_` API token.
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Record id.
      schema:
        type: string
    PortalScopes:
      name: scopes
      in: query
      required: false
      description: Comma-separated scopes requested (for example `community.*,profile.*`). The answer carries only those the consumer may hold.
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request (malformed body, unknown fields, bad value).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, malformed, unknown, revoked or expired credentials (always the same body).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller lacks the scope, rank or standing, or the action is refused (for example approving one's own payout).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found, or not visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The record is not in a state that allows this, or the change conflicts with stored state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: A required configuration or dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Internal error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoSession:
      description: Not signed in (`error` is `no_session`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PortalUnauthorized:
      description: Any authentication failure; the cause is not disclosed.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                enum: [unauthorized]
    PortalNotFound:
      description: Unknown member, a member this consumer may not see, or no active CRA snapshot. All identical.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                enum: [not_found]
    PortalUnavailable:
      description: "`MSYNC_SUBJECT_KEY` is not configured, or the lookup could not be recorded."
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                enum: [unavailable]
    OAuthError:
      description: "An OAuth error: `{error, error_description}` (400, or 401 with `WWW-Authenticate: Basic` for `invalid_client`)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthError"
    OAuthUnavailable:
      description: The OAuth provider is not configured (`temporarily_unavailable`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthError"
    BearerInvalid:
      description: "`invalid_token`, with a `WWW-Authenticate: Bearer` header."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthError"
  schemas:
    Error:
      type: object
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
        error:
          type: string
          description: Machine code on the account and OAuth routes.
    Success:
      type: object
      description: "`{status: \"success\"}` plus operation-specific keys described on each response."
      properties:
        status:
          type: string
      additionalProperties: true
    Health:
      type: object
      properties:
        status:
          type: string
          example: healthy
        version:
          type: string
        uptime_seconds:
          type: integer
        dev_mode:
          type: boolean
    EmptyBody:
      type: object
      description: An action endpoint takes no body. An empty body or `{}` is accepted; anything else (for example a body naming an approver) is 400.
      additionalProperties: false
    ReasonBody:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
    CreateTokenBody:
      type: object
      additionalProperties: false
      required: [label, member_id, scopes]
      properties:
        label:
          type: string
        member_id:
          type: string
          description: The CRA member the token acts as.
        scopes:
          type: array
          items:
            type: string
            enum:
              - hierarchy.read
              - merit.read
              - merit.score
              - payouts.read
              - payouts.prepare
              - payouts.approve
              - payouts.execute
              - payouts.policy
              - tokens.manage
              - payees.read
              - payees.manage
              - payorders.read
              - payorders.manage
              - payorders.approve
              - invoices.submit
              - invoices.read
              - invoices.approve
              - audit.read
              - oauth.clients
        payee_keys:
          type: array
          items:
            type: string
          description: Payee keys the token may act for (for example a payee reading their own statement).
        expires_at:
          type: string
          format: date-time
    CreateRunBody:
      type: object
      additionalProperties: false
      properties:
        dry_run:
          type: boolean
          default: true
          description: Defaults to true. A run is persisted only when this is explicitly false.
    BlockBody:
      type: object
      additionalProperties: false
      required: [payee_key, reason]
      properties:
        payee_key:
          type: string
        reason:
          type: string
    PayoutPolicy:
      type: object
      additionalProperties: false
      required: [schema, enabled, currency, schedule, limits, approval]
      properties:
        schema:
          type: integer
          description: The policy schema version the server expects.
        enabled:
          type: boolean
          description: false is the kill switch; nothing is prepared or paid.
        currency:
          type: string
          description: Three lowercase letters (ISO 4217), for example `usd`.
        schedule:
          type: object
          additionalProperties: false
          required: [cadence]
          properties:
            cadence:
              type: string
              enum: [manual, weekly, biweekly, monthly]
            day:
              description: A lowercase weekday name (weekly, biweekly) or a day of month 1 to 28 (monthly).
              oneOf:
                - type: string
                - type: integer
            hour_utc:
              type: integer
              minimum: 0
              maximum: 23
            mode:
              type: string
              enum: [prepare, auto]
              default: prepare
        limits:
          type: object
          additionalProperties: false
          description: All optional and non-negative; an absent limit does not apply.
          properties:
            min_payout_cents:
              type: integer
            max_per_payout_cents:
              type: integer
            max_per_member_per_period_cents:
              type: integer
            max_per_run_cents:
              type: integer
            hold_days:
              type: integer
        approval:
          type: object
          additionalProperties: false
          required: [approvals_required]
          description: A payee can never approve their own payout; that is not configurable.
          properties:
            approvals_required:
              type: integer
              minimum: 1
            min_approver_rank:
              type: integer
              default: 0
        eligibility:
          type: object
          additionalProperties: false
          properties:
            min_rank:
              type: integer
              default: 0
            roles:
              type: array
              items:
                type: string
            require_verified_identity:
              type: boolean
              default: false
        rate:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [branch, base_cents, merit_multiplier]
            properties:
              branch:
                type: string
              base_cents:
                type: integer
              merit_multiplier:
                type: number
    NewPayee:
      type: object
      additionalProperties: false
      required: [display_name, kind]
      description: There is no bank or card field, by design.
      properties:
        display_name:
          type: string
        legal_name:
          type: string
        kind:
          type: string
          enum: [individual, company]
        email:
          type: string
        member_id:
          type: string
          description: The CRA member this payee is, if any.
        payee_keys:
          type: array
          items:
            type: string
        stripe_account_id:
          type: string
          description: A Stripe Connect account id (`acct_...`). Starts not enabled.
        tax_form_status:
          type: string
          enum: [none, requested, on_file]
        notes:
          type: string
    PayeePatch:
      type: object
      additionalProperties: false
      description: Absent fields are unchanged; `null` clears an optional field.
      properties:
        display_name:
          type: string
        legal_name:
          type: [string, "null"]
        kind:
          type: string
          enum: [individual, company]
        email:
          type: [string, "null"]
        member_id:
          type: [string, "null"]
        payee_keys:
          type: array
          items:
            type: string
        stripe_account_id:
          type: [string, "null"]
        tax_form_status:
          type: string
          enum: [none, requested, on_file]
        status:
          type: string
          enum: [active, paused, closed]
        notes:
          type: [string, "null"]
    AmountRule:
      description: How much an order pays, tagged by `kind`.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, payee_id, amount_cents]
          description: A set amount to one payee (salary, stipend, retainer, bonus).
          properties:
            kind:
              type: string
              enum: [fixed]
            payee_id:
              type: string
            amount_cents:
              type: integer
        - type: object
          additionalProperties: false
          required: [kind, pool_cents, shares]
          description: A pool per period split by fixed percentages. The sum of bps is at most 10000; the rest is not paid.
          properties:
            kind:
              type: string
              enum: [pool_percent]
            pool_cents:
              type: integer
            shares:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [payee_id, bps]
                properties:
                  payee_id:
                    type: string
                  bps:
                    type: integer
        - type: object
          additionalProperties: false
          required: [kind, pool_cents]
          description: A pool per period split in proportion to XP earned in the period.
          properties:
            kind:
              type: string
              enum: [pool_by_xp]
            pool_cents:
              type: integer
            repos:
              type: array
              description: Only XP earned in these repositories counts. Empty means every repository.
              items:
                type: object
                additionalProperties: false
                required: [provider, repo]
                properties:
                  provider:
                    type: string
                    enum: [github, gitlab]
                  host:
                    type: string
                  repo:
                    type: string
            roles:
              type: array
              items:
                type: string
            payee_ids:
              type: array
              items:
                type: string
            min_xp:
              type: integer
              default: 0
            max_share_bps:
              type: integer
              description: The most one payee can receive, in bps of the pool. The excess is not paid.
        - type: object
          additionalProperties: false
          required: [kind, payee_id, bps]
          description: A percentage of a stated base amount to one payee.
          properties:
            kind:
              type: string
              enum: [percent_of_amount]
            payee_id:
              type: string
            bps:
              type: integer
            base_cents:
              type: integer
            bases:
              type: object
              description: Per-occurrence bases keyed by period key (a date); wins over `base_cents`.
              additionalProperties:
                type: integer
    OrderSchedule:
      description: When an order occurs, tagged by `kind`. Occurrences are at 00:00 UTC.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, date]
          properties:
            kind:
              type: string
              enum: [once]
            date:
              type: string
              format: date
        - type: object
          additionalProperties: false
          required: [kind, cadence, start]
          description: Occurs on `start` and every cadence step after it. `end` (inclusive) and `count` both stop the schedule; the first reached wins.
          properties:
            kind:
              type: string
              enum: [repeat]
            cadence:
              type: string
              enum: [weekly, biweekly, monthly, quarterly]
            start:
              type: string
              format: date
            end:
              type: string
              format: date
            count:
              type: integer
              minimum: 1
    NewOrder:
      type: object
      additionalProperties: false
      required: [name, rule, schedule]
      properties:
        name:
          type: string
        currency:
          type: string
          description: Defaults to the payout policy currency; must equal it.
        rule:
          $ref: "#/components/schemas/AmountRule"
        schedule:
          $ref: "#/components/schemas/OrderSchedule"
        memo:
          type: string
        draft:
          type: boolean
          default: false
          description: true creates the order as a draft that never materializes until resumed.
    OrderPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        memo:
          type: [string, "null"]
        currency:
          type: string
        rule:
          $ref: "#/components/schemas/AmountRule"
        schedule:
          $ref: "#/components/schemas/OrderSchedule"
    InvoiceLine:
      type: object
      additionalProperties: false
      required: [description, quantity, unit_amount_cents]
      properties:
        description:
          type: string
          maxLength: 500
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
          description: Whole units.
        unit_amount_cents:
          type: integer
    NewInvoice:
      type: object
      additionalProperties: false
      required: [payee_id, number, issue_date, due_date, lines, total_cents]
      properties:
        payee_id:
          type: string
        number:
          type: string
          description: The invoice number; unique per payee.
        issue_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        currency:
          type: string
          description: Defaults to the payout policy currency; must equal it.
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/InvoiceLine"
        tax_cents:
          type: integer
          default: 0
        total_cents:
          type: integer
          description: Must equal the line subtotal plus `tax_cents`.
        memo:
          type: string
        attachment_ref:
          type: string
          description: A reference to an attachment kept elsewhere (a URL or a document id). Not fetched.
    ScoreInput:
      type: object
      additionalProperties: false
      description: A rubric score submission. There is no scorer, actor or author field; the scorer is the token's member.
      required: [subject, rubric_id, rubric_hash, ci_passed, reverted, criteria]
      properties:
        subject:
          type: object
          additionalProperties: false
          required: [provider, repo, subject_id]
          properties:
            provider:
              type: string
              enum: [github, gitlab]
            host:
              type: string
              description: Defaults to github.com or gitlab.com.
            repo:
              type: string
            subject_id:
              description: The pull request or merge request number, as a string or a number.
              oneOf:
                - type: string
                - type: integer
        rubric_id:
          type: string
          description: Take it from `GET /api/v1/merit/rubric`.
        rubric_hash:
          type: string
          description: Take it from `GET /api/v1/merit/rubric`; a stale hash is refused.
        ci_passed:
          type: boolean
        reverted:
          type: boolean
        criteria:
          type: object
          additionalProperties: false
          description: All six criteria of the rubric, each exactly once.
          required: [impact, correctness, difficulty, quality, risk, communication]
          properties:
            impact:
              $ref: "#/components/schemas/CriterionLevel"
            correctness:
              $ref: "#/components/schemas/CriterionLevel"
            difficulty:
              $ref: "#/components/schemas/CriterionLevel"
            quality:
              $ref: "#/components/schemas/CriterionLevel"
            risk:
              $ref: "#/components/schemas/CriterionLevel"
            communication:
              $ref: "#/components/schemas/CriterionLevel"
    CriterionLevel:
      type: object
      additionalProperties: false
      required: [level, evidence]
      properties:
        level:
          type: integer
          minimum: 0
          maximum: 255
          description: A level defined by the rubric.
        evidence:
          type: string
    PortalMember:
      type: object
      description: A member as one consumer may see it. Fields outside the consumer's allowlist are omitted, never null.
      required: [subject, status, scopes_granted, policy_version, issued_at, cache_ttl_seconds]
      properties:
        subject:
          type: string
          description: Pairwise subject id, `sub_` plus 32 hex characters; different for every consumer.
        status:
          type: string
          description: Always present, so a consumer learns of a suspension (active, suspended or removed).
        tier:
          type: object
          properties:
            key:
              type: string
            label:
              type: string
            rank:
              type: integer
        positions:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              rank:
                type: integer
              expires_at:
                type: [string, "null"]
                description: The last day the position counts.
        merit:
          type: object
          properties:
            vested:
              type: integer
        permissions:
          type: array
          items:
            type: string
          description: The member's effective permissions filtered to `scopes_granted`.
        scopes_granted:
          type: array
          items:
            type: string
        policy_version:
          type: integer
          description: The active CRA snapshot id.
        issued_at:
          type: string
          format: date-time
        cache_ttl_seconds:
          type: integer
          description: Cache an answer for at most this long.
    SlackCommandForm:
      type: object
      description: The standard Slack slash command form fields (others are accepted and ignored).
      required: [command, team_id, user_id]
      properties:
        command:
          type: string
        text:
          type: string
        team_id:
          type: string
        user_id:
          type: string
        response_url:
          type: string
    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          description: Omit for a notification.
          oneOf:
            - type: string
            - type: integer
        method:
          type: string
          enum: [initialize, ping, tools/list, tools/call]
        params:
          type: object
          additionalProperties: true
    EmailStartBody:
      type: object
      required: [email]
      properties:
        email:
          type: string
        link:
          type: string
          description: The signed-in session's link nonce, to add this address to that account.
    AuthorizeForm:
      type: object
      required: [response_type, client_id, redirect_uri, scope, code_challenge, code_challenge_method, csrf, decision]
      properties:
        response_type:
          type: string
        client_id:
          type: string
        redirect_uri:
          type: string
        scope:
          type: string
        state:
          type: string
        nonce:
          type: string
        code_challenge:
          type: string
        code_challenge_method:
          type: string
        csrf:
          type: string
          description: The consent token from the form.
        decision:
          type: string
          enum: [allow, deny]
    TokenForm:
      type: object
      description: Form body of `/oauth/token` and `/oauth/revoke`.
      properties:
        grant_type:
          type: string
          enum: [authorization_code, refresh_token]
        code:
          type: string
        redirect_uri:
          type: string
        code_verifier:
          type: string
        refresh_token:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        token:
          type: string
          description: "`/oauth/revoke` only: the token to revoke."
        token_type_hint:
          type: string
    OAuthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
        refresh_token:
          type: string
        scope:
          type: string
        id_token:
          type: string
          description: Present when the `openid` scope was granted.
    OAuthError:
      type: object
      properties:
        error:
          type: string
        error_description:
          type: string
    NewClient:
      type: object
      additionalProperties: false
      required: [name, redirect_uris, allowed_scopes]
      properties:
        name:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        public:
          type: boolean
          default: false
          description: A public client (a browser or native app) gets no secret.
        allowed_scopes:
          type: array
          items:
            type: string
            enum: [openid, profile, groups, rank, merit]
        allowed_claims:
          type: array
          items:
            type: string
            enum: [name, handle, groups, titles, rank, merit]
        consumer_key:
          type: [string, "null"]
          description: The CRA `[[consumer]]` key this platform corresponds to, if any.
    OnboardRequest:
      type: object
      required: [github_username]
      properties:
        github_username:
          type: string
    DecisionRequest:
      type: object
      required: [decided_by]
      properties:
        decided_by:
          type: string
        reason:
          type: [string, "null"]
