  "/api/v1/invoices":
    get:
      tags: [payroll]
      summary: List invoices
      description: |
        Invoices of the organization, filtered by status and payee. Needs scope
        `invoices.read`; a payee may read their own.
      x-msync-scope: invoices.read
      security:
        - bearerToken: []
