                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [payroll]
      summary: Submit an invoice
      description: |
        Submits an invoice for a payee. The line subtotal plus `tax_cents` must equal
        `total_cents` (400 otherwise); at most 200 lines. Needs scope `invoices.submit`.
        409 on a duplicate invoice number for the payee.
      x-msync-scope: invoices.submit
      security:
        - bearerToken: []
