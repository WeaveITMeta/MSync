      tags: [payroll]
      summary: Reject an invoice
      description: |
        Rejects a submitted invoice with an optional reason. Needs scope `invoices.approve`.
        The payee of an invoice can never act on it (403); 409 unless the invoice is submitted.
        An empty body is accepted.
      x-msync-scope: invoices.approve
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
