          description: "`{status, payorder}`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  "/api/v1/payorders/{id}/approve":
    post:
      tags: [payroll]
      summary: Approve a pay order
      description: |
        Records the token's member as an approver of the order's current revision. Needs scope
        `payorders.approve`. Body must be empty or `{}`; a body naming an approver is 400. A
        payee can never approve an order that pays them (403), and the creator rules of the
        payout policy apply (distinct approvers, minimum rank).
      x-msync-scope: payorders.approve
      security:
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
