# cargo audit configuration. Every entry here is an advisory with no fix reachable from this
# repository today. Re-check each one whenever serenity, chrono or chrono-tz publish a release,
# and delete the entry the moment a fix can be taken. Never add an advisory that has a fix.

[advisories]
ignore = [
    # rustls 0.22.4 and rustls-webpki 0.102.8 come only through the Discord gateway websocket:
    #   cargo tree -i rustls@0.22.4
    #   rustls 0.22.4 <- tokio-rustls 0.25 / tungstenite 0.21 <- tokio-tungstenite 0.21.0
    #     <- serenity 0.12.5 <- msync
    # serenity 0.12.5 is the newest release on crates.io (checked 2026-11-20) and pins
    # tokio-tungstenite 0.21, which pins rustls 0.22. Everything else in the tree is on
    # rustls 0.23.46+ / rustls-webpki 0.103.17+. Fixed versions (rustls >=0.23.46,
    # rustls-webpki >=0.103.16) are not semver-compatible with what tungstenite 0.21 needs.
    "RUSTSEC-2026-0346", # rustls 0.22.4: Debug impls for client session values expose TLS secrets
    "RUSTSEC-2026-0349", # rustls 0.22.4: unauthenticated ServerHello can downgrade later connections
    "RUSTSEC-2026-0049", # rustls-webpki 0.102.8: CRL distribution point matching
    "RUSTSEC-2026-0098", # rustls-webpki 0.102.8: URI name constraints accepted
    "RUSTSEC-2026-0099", # rustls-webpki 0.102.8: name constraints with wildcard names
    "RUSTSEC-2026-0104", # rustls-webpki 0.102.8: reachable panic in CRL parsing
    "RUSTSEC-2026-0382", # rustls-webpki 0.102.8: distrusted intermediates may be accepted

    # Unmaintained, and no fixed release exists ("No fixed upgrade is available"):
    #   chrono 0.4.41: direct dependency, and through sqlx-core/sqlx-sqlite 0.9.1 (the chrono
    #   feature decodes every stored timestamp), octocrab 0.54.9, serenity 0.12.5, chrono-tz.
    #   chrono-tz 0.10.4: direct dependency (IANA zones for shifts, contract 14.3).
    # Replacing them means porting every timestamp in the engine, the database layer and the
    # three API clients to another time library; out of scope for a dependency upgrade.
    "RUSTSEC-2026-0543", # chrono is unmaintained
    "RUSTSEC-2026-0555", # chrono-tz is unmaintained
]
