version: '3.8'

services:
  msync:
    build: .
    container_name: msync-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Keeps the pre-rename file name: an existing ./data volume keeps its database.
      - DATABASE_URL=sqlite:///app/data/dsync.db
      - RUST_LOG=info,msync=debug
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - msync-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a reverse proxy for HTTPS
  nginx:
    image: nginx:alpine
    container_name: msync-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - msync
    networks:
      - msync-network

networks:
  msync-network:
    driver: bridge

volumes:
  data:
  logs:
