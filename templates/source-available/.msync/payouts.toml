schema = 1

# payouts.toml: when, how much and under what approval people are paid.
# Source available: payees must be verified members.
#
# The human decides: whether payouts are on at all, the amounts, who approves,
# and the rates. Money never moves without the approvals set here. A payee can
# never approve their own payout.

# false is the kill switch: nothing is prepared or paid.
enabled = true
# Three lowercase letters.
currency = "usd"

[schedule]
# manual | weekly | biweekly | monthly
cadence = "weekly"
# A weekday name for weekly and biweekly, or 1 to 28 for monthly.
day = "friday"
hour_utc = 17
# prepare: MSync drafts the payout and waits for approvals. auto: it proceeds
# once approvals are in. Start with prepare.
mode = "prepare"

# Amounts are in cents. Order: min <= per payout <= per member per period, and
# per payout <= per run.
[limits]
min_payout_cents = 500
max_per_payout_cents = 10000
max_per_member_per_period_cents = 50000
max_per_run_cents = 250000
# Days a payout is held before release. Not below the policy value of 10 set in org.toml.
hold_days = 10

[approval]
# Minimum 1.
approvals_required = 2
# An approver needs at least this rank (and the payouts.approve permission).
min_approver_rank = 60

[eligibility]
# Lowest rank that may be paid.
min_rank = 0
# Role keys allowed to be paid; empty means any role (subject to the mode).
roles = []
# Only people whose identity is proven can be paid.
require_verified_identity = true

# One rate per payout branch (it must be listed in a foundry's payout_branches).
# Pay = base_cents + merit_multiplier * merit points earned in the period.
[[rate]]
branch = "main"
base_cents = 1000
merit_multiplier = 0.01
