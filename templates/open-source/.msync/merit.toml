schema = 1

# merit.toml: how contributions turn into merit points.
# Open mode: outside contributions earn merit.
#
# Merit vests after vesting_days, so a revert or a clawback can still catch a
# bad contribution. Tiers in roles.toml are computed from VESTED merit.
# The human decides: which events count, their point values and caps.

# The scoring rubric the engine knows. Do not change it.
rubric = "msync-rubric-v1"
# Who scores a contribution beyond base points: agent, coderabbit, or an
# empty list for base points only.
scorers = ["agent"]
# How many scorers must agree (between 1 and the number of scorers).
min_scorers = 1
score_window_days = 7

# A merged pull request. base_points is the starting score, max_points the most one event can earn,
# daily_cap the most per person per day, external_counts whether non-members earn it.
[[event]]
key = "pr_merged"
base_points = 10
max_points = 60
weight = 1.0
daily_cap = 150
vesting_days = 14
external_counts = true

# An approving review. base_points is the starting score, max_points the most one event can earn,
# daily_cap the most per person per day, external_counts whether non-members earn it.
[[event]]
key = "review_approved"
base_points = 10
max_points = 10
weight = 1.0
daily_cap = 40
vesting_days = 14
external_counts = true

# A closed issue. base_points is the starting score, max_points the most one event can earn,
# daily_cap the most per person per day, external_counts whether non-members earn it.
[[event]]
key = "issue_closed"
base_points = 5
max_points = 20
weight = 1.0
daily_cap = 40
vesting_days = 14
external_counts = true

# A merged documentation change. base_points is the starting score, max_points the most one event can earn,
# daily_cap the most per person per day, external_counts whether non-members earn it.
[[event]]
key = "docs_merged"
base_points = 8
max_points = 30
weight = 1.0
daily_cap = 60
vesting_days = 14
external_counts = true

# A published release; members only. base_points is the starting score, max_points the most one event can earn,
# daily_cap the most per person per day, external_counts whether non-members earn it.
[[event]]
key = "release_published"
base_points = 25
max_points = 25
weight = 1.0
daily_cap = 25
vesting_days = 14
external_counts = false

