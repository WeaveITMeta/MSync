schema = 1

# merit.toml: how contributions turn into merit points.
# Merit-driven collective: merit is the main road to standing, so many kinds of work count.
#
# Merit vests after vesting_days, so a revert or a clawback can still catch a
# bad contribution. Tiers in roles.toml are computed from VESTED merit.
# The human decides: which events count, their point values and caps.

# The scoring rubric the engine knows. Do not change it.
rubric = "msync-rubric-v1"
# Who scores a contribution beyond base points: agent, coderabbit, or an
# empty list for base points only.
scorers = ["agent"]
# How many scorers must agree (between 1 and the number of scorers).
min_scorers = 1
score_window_days = 7

# A merged pull request. base_points is the starting score, max_points the most one event can earn,
# daily_cap the most per person per day, external_counts whether non-members earn it.
[[event]]
key = "pr_merged"
base_points = 12
max_points = 80
weight = 1.0
daily_cap = 200
vesting_days = 14
external_counts = true

