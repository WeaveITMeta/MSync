schema = 1

# roles.toml: the job titles and ranks of the organization.
#
# Two kinds of role. A TIER is earned: a member holds the highest tier whose
# min_merit they have vested. A POSITION is appointed: it is granted to a
# member in members.toml. Rank orders everything: a person can only change
# things strictly BELOW their own rank. Rank 1000 is owners only and comes from
# engine configuration, never from this file.
#
# The human decides: the titles, the ranks, which permissions each rank holds,
# and the Discord role and Slack user group each title maps to. The
# discord_role and slack_usergroup lines are optional; delete them for a
# platform you do not use. Every id must be real and unique per role.
# Mode hybrid: tiers reach rank 30. Positions from rank 50 up are two-person and serve at most 180 days.

# Everyone starts here.
[[role]]
key = "newcomer"
title = "Newcomer"
kind = "tier"
rank = 0
min_merit = 0
permissions = ["profile.self", "community.read", "leaderboard.read"]

# Earned at 50 vested merit.
[[role]]
key = "contributor"
title = "Contributor"
kind = "tier"
rank = 10
min_merit = 50
permissions = ["profile.self", "community.read", "leaderboard.read", "community.post", "community.vote"]
discord_role = "REPLACE_ME_DISCORD_ROLE_CONTRIBUTOR"
slack_usergroup = "REPLACE_ME_SLACK_USERGROUP_CONTRIBUTOR"

# Earned at 400 vested merit; the ceiling for tiers.
[[role]]
key = "core-contributor"
title = "Core Contributor"
kind = "tier"
rank = 30
min_merit = 400
permissions = ["profile.self", "community.read", "leaderboard.read", "community.post", "community.vote", "community.events", "roster.read_members"]
discord_role = "REPLACE_ME_DISCORD_ROLE_CORE_CONTRIBUTOR"
slack_usergroup = "REPLACE_ME_SLACK_USERGROUP_CORE_CONTRIBUTOR"

# Appointed staff role below the two-person line.
[[role]]
key = "engineer"
title = "Engineer"
kind = "position"
rank = 20
permissions = ["community.post", "community.vote", "roster.read_members", "merit.read_own"]
discord_role = "REPLACE_ME_DISCORD_ROLE_ENGINEER"
slack_usergroup = "REPLACE_ME_SLACK_USERGROUP_ENGINEER"

# Appointed.
[[role]]
key = "senior-engineer"
title = "Senior Engineer"
kind = "position"
rank = 40
permissions = ["community.moderate", "roster.read_full", "merit.read_all"]
discord_role = "REPLACE_ME_DISCORD_ROLE_SENIOR_ENGINEER"
slack_usergroup = "REPLACE_ME_SLACK_USERGROUP_SENIOR_ENGINEER"

# Appointed. Rank 60 is two-person; needs expires within 180 days.
[[role]]
key = "team-lead"
title = "Team Lead"
kind = "position"
rank = 60
permissions = ["members.invite", "members.grant", "members.approve_grant", "members.revoke", "members.suspend", "payouts.read_all", "payouts.approve", "roster.read_full", "merit.award_manual"]
discord_role = "REPLACE_ME_DISCORD_ROLE_TEAM_LEAD"
slack_usergroup = "REPLACE_ME_SLACK_USERGROUP_TEAM_LEAD"
max_holders = 3
term_days = 180
merit_eligibility = 1000
compartments = ["core-team"]

# Appointed. Can change policy; needs a second approver.
[[role]]
key = "director"
title = "Director"
kind = "position"
rank = 80
permissions = ["members.invite", "members.grant", "members.approve_grant", "members.revoke", "members.suspend", "payouts.read_all", "payouts.approve", "roster.read_full", "merit.award_manual", "merit.clawback", "policy.propose_change", "policy.approve_change", "consumers.manage", "discord.reconcile", "audit.read_all"]
discord_role = "REPLACE_ME_DISCORD_ROLE_DIRECTOR"
slack_usergroup = "REPLACE_ME_SLACK_USERGROUP_DIRECTOR"
max_holders = 2
term_days = 180
compartments = ["core-team"]

