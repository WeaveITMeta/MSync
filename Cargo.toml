[package]
name = "msync"
version = "0.1.0"
edition = "2021"
authors = ["MSync Contributors"]
license = "Apache-2.0"
description = "A Discord bot template for merit-based open source community management"
repository = "https://github.com/yourusername/msync"
keywords = ["discord", "bot", "github", "merit", "community"]
categories = ["web-programming", "command-line-utilities"]

[dependencies]
# Web framework
actix-web = "4.5"
actix-rt = "2.9"

# Discord
serenity = { version = "0.12.5", features = ["client", "gateway", "model", "framework", "standard_framework"] }
tokio = { version = "1.36", features = ["full"] }

# Database
# SQLite only: no TLS backend is needed (sqlx 0.9 split runtime and TLS features).
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate", "uuid", "chrono"] }

# GitHub API
# Defaults minus the JWT (GitHub App) auth, which is unused and would pull aws-lc-rs.
octocrab = { version = "0.54", default-features = false, features = ["default-client", "follow-redirect", "retry", "rustls", "rustls-ring", "timeout", "tracing"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
config = "0.14"
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }
# IANA time zones for shifts (contract 14.3), so daylight saving is right.
chrono-tz = "0.10"

# UUID generation
uuid = { version = "1.7", features = ["v4", "serde"] }

# Webhook signature verification
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2.5"

# Random secrets for API tokens (already in the tree via uuid; no new crate)
getrandom = "0.3"

# CRA (Central Rank Authority) file parsing
toml = "0.8"

# Async traits
async-trait = "0.1"

# MSync as an OAuth/OIDC provider: ES256 signing and AES-256-GCM sealing of the stored signing
# key. ring 0.17 is already compiled into the tree (rustls, jsonwebtoken), so this adds no new
# code; it is pure Rust plus audited assembly, no OpenSSL.
ring = "0.17"
# base64url for JWTs and PKCE; already in the tree through reqwest and octocrab.
base64 = "0.22"

[build-dependencies]
chrono = "0.4"

[dev-dependencies]
mockito = "1.2"
