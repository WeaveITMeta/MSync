schema = 1

# Example CRA for a closed-source company that uses Slack only (no Discord).
# Every name except McKale Olson is a placeholder, every Slack id is a fake id,
# and the repository paths are placeholders. Replace them before use. This is
# an illustration of the file format, not a description of the company.

[org]
slug = "weave-solutions"
name = "Weave Solutions"
mode = "closed"
template = "closed-source"

[policy]
# Closed mode counts only internal.* and manual.award by default. Work in the
# company's private repositories is internal work, so it is recorded too.
# Merit still confers no rank: the closed-mode merit_rank_ceiling is 0.
"merit.sources_enabled" = ["internal.*", "github.*", "manual.award"]

[slack]
team_id = "T2000000000"
alert_channel_id = "C2000000009"

[[foundry]]
provider = "github"
repo = "example-weave/weave-core"
visibility = "private"
canonical = true
payout_branches = ["main"]

[[foundry]]
provider = "github"
repo = "example-weave/weave-infra"
visibility = "private"
canonical = true
payout_branches = ["main"]

[[compartment]]
key = "client-work"
label = "Client engagements"
classification = "confidential"
