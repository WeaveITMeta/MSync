schema = 1
enabled = true
currency = "usd"

# Monthly, for appointed positions only (closed-mode payouts.eligible =
# positions_only). Two approvers at rank 70 or above; a payee can never
# approve their own payout.

[schedule]
cadence = "monthly"
day = 1
hour_utc = 17
mode = "prepare"

[limits]
min_payout_cents = 1000
max_per_payout_cents = 100000
max_per_member_per_period_cents = 400000
max_per_run_cents = 2000000
hold_days = 14

[approval]
approvals_required = 2
min_approver_rank = 70

[eligibility]
min_rank = 10
roles = ["contractor", "engineer", "senior-engineer", "director"]
require_verified_identity = true

[[rate]]
branch = "main"
base_cents = 2500
merit_multiplier = 0.0
